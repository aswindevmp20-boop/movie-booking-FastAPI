version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: booker
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bookings
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: .
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://booker:secret@postgres:5432/bookings
      - REDIS_URL=redis://redis:6379/0
